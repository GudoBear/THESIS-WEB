<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
   
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    
</head>
<body>

    <div class="sidebar">

        <div class="logo">
           <img src="logo.png" alt="logo">
            <span class="logo-text">DMAC INVENTORY</span>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html">
                <span class="icon">
                    <i class="bi bi-grid"></i>
                </span>
                <span class="description">Dashboard</span>
            </a>

            <a class="nav-link" href="#" data-bs-toggle="collapse" data-bs-target="#submenu" aria-expanded="false" aria-controls="submenu">
                <span class="icon">
                    <i class="bi bi-box"></i>
                </span>
                <span class="description-active">Container   <i class="bi bi-caret-down-fill"></i></span>
            </a>

            <div class="sub-menu collapse" id="submenu">
                <a class="nav-link" href="boxes.html">
                    <span class="icon">
                        <i class="bi bi-box2"></i>
                    </span>
                    <span class="description-active"></i> Boxes</span>

                </a>

                <a class="nav-link" href="cages.html">
                    <span class="icon">
                        <i class="bi bi-grid-3x3"></i>
                    </span>
                    <span class="description">Cage</span> 
                    
                </a>
            </div>


            <a class="nav-link" href="medicine.html">
                <span class="icon">
                    <i class="bi bi-prescription"></i>
                </span>
                <span class="description">Medicine</span>
            </a>

            <a class="nav-link" href="feeds.html">
                <span class="icon">
                    <i class="bi bi-basket3"></i>
                </span>

            </a>

            <div class="logout">
                <a class="nav-link" href="#">
                    <span class="description">Logout</span>
                    <span class="icon">
                    <i class="bi bi-box-arrow-right"></i>
                    </span>
                </a>
            </div>
        </nav>
    </div>

<main>
<div class="container-fluid px-4">
    
    <div class="main-content row gx-4 gy-4">
 <nav class="navbar navbar-expand-lg bg-body-secondary">
        <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="boxes.html">Summary</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="reserved-boxes.html">Reserved Boxes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="restock-box.html">Restock Boxes</a>
        </li>
        
      </ul>
    </div>
    </nav>
    <div class="card text-center">
        <h4 class="card-header mb-2">Add Stock</h4>
         
            <form class="py-3 px-5">
                <div class="row g-3 align-items-center">
            <div class="col">
                <label for="reservebox" class="col-form-label">Select Box Size</label>
            </div>
                <div class="col">
                <select class="form-select" aria-label="Default select example">
                    <option selected>Box Size</option>
                    <option value="1">Small</option>
                    <option value="2">Medium</option>
                    <option value="3">Large</option>
                    <option value="3">Extra Large</option>
                    <option value="3">XX-Large</option>
                </select>
            </div>
            <div class="col">
      <button type="submit" class="btn btn-primary">Add Stock</button>
      </div>
      </div>
            </form>
        </div>
        <div class="card text-center">
        <h4 class="card-header mb-2">Add Quantity</h4>
         
            <form class="py-3 px-5">
                <div class="row g-3 align-items-center">
            <div class="col">
                <label for="box" class="col-form-label">Select Box:</label>
            </div>
                <div class="col">
                <select class="form-select" aria-label="Default select example">
  <option selected>Box ID</option>
  <option value="1">[1] Small</option>
  <option value="2">[2] Medium</option>
  <option value="3">[3] Large</option>
</select>
            </div>
             <div class="col">
                <label for="box" class="col-form-label">Enter Quantity:</label>
            </div>
             <div class="col">
                <input type="number" id="quantity" class="form-control" aria-describedby="quantity" placeholder="quantity">
            </div>
            <div class="col">
      <button type="submit" class="btn btn-primary">Add Quantity</button>
      </div>
      </div>
            </form>
        </div>

        
    <div class="card p-4">
        
        <h2 class="card-title text-center mb-3">Need for a Restock Boxes</h2>
        <p class="text-muted text-center fst-italic">stocks that are 5 and below</p>
        <table class="table table-striped text-center mt-4">
    <thead>
        <tr>
            <th scope="col">Box id</th>
            <th scope="col">Box Size</th>
            <th scope="col">Quantity</th>
            <th scope="col">Stock Status</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row">1</th>
            <td>small</td>
            <td>5</td>
            <td>Low-stock</td>
        </tr>
       <tr></tr>
            <th scope="row">2</th>
            <td>medium</td>
            <td>3</td>
            <td>Low stock</td>
        </tr>
        <tr>
            <th scope="row">3</th>
            <td>large</td>
            <td>0</td>
            <td>Out of stock</td>
        </tr>
    </tbody>
</table>

    </div>

   
</div>
</div>



</main>




    


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
